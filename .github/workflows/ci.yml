name: CI

on:
  push:
    branches: [master, feature/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Generate demo data
        # data/ 不入库；CI 冷启动必须先生成 demo_sales.csv，否则 nl2sql/error 用例缺 fixture
        run: python scripts/gen_data.py --sales-only
      - name: Tests (unit + integration, offline)
        # 集成测试同样不依赖 MySQL / Redis / 网络（FakeRedis + monkeypatch）；
        # 依赖 MySQL 的少数用例自带 skipif，CI 中自动跳过
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        # 类型检查通过不代表构建通过（App Router 预渲染/依赖解析都会挂）
        working-directory: frontend
        run: npm run build
